[project]
name = "fastmcp-test"
version = "0.1.0"
description = "FastMCP server with per-tool bearer-token auth + React (Chakra UI + TanStack Query) client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "uvicorn>=0.30",
    "joserfc>=1.0",
    "faker>=40",
]

[dependency-groups]
dev = [
    "pytest",
]
